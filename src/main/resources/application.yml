server:
  port: 8083

spring:
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/golden_oddjobs}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.${AWS_REGION:us-east-1}.amazonaws.com/${COGNITO_USER_POOL_ID}
  # Solo se usa si messaging.provider=rabbit (Amazon MQ o RabbitMQ local)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    ssl:
      enabled: ${RABBITMQ_SSL:false}

cognito:
  app-client-id: ${COGNITO_APP_CLIENT_ID}

aws:
  region: ${AWS_REGION:us-east-1}

# ---- Broker "plug and play": cambia solo esta propiedad (variable MESSAGING_PROVIDER) ----
#   sns    -> publica en un topic SNS; SNS hace fanout a 2 colas SQS; 2 Lambdas las consumen
#   rabbit -> publica en el exchange fanout "informe"; 2 colas; 2 listeners dentro del BFF
messaging:
  provider: ${MESSAGING_PROVIDER:sns}
  sns:
    topic-arn: ${SNS_TOPIC_ARN:}
  rabbit:
    exchange: informe
    queue-informe: informe
    queue-db: db-informe

bff:
  # Secreto compartido: lo inyecta API Gateway y lo usan las Lambdas para llamar a /api/notice
  api-secret: ${API_SECRET}
  # true = TODA ruta /api/** (menos /api/health) exige el header x-api-secret (EC2 solo accesible vía Gateway)
  enforce-secret-on-all: ${BFF_ENFORCE_SECRET_ON_ALL:false}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
